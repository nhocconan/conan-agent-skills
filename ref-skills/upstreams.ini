# Upstream files this repo's wrappers actually read.
# `refsync.py ensure` / `upgrade` copies those files into `.vendor/` — never a
# full suite install, never `./setup`, never bun.
#
# kind=github-files  GET each `files` entry from raw.githubusercontent.com
# kind=npx           run `install` when missing on a harness; `update` otherwise
#
# Skills with REF.md `upstream: <name>` pull that section. `provides` are
# load-out names that appear after install (empty for file-only upstreams).

[gstack]
kind = github-files
repo = garrytan/gstack
ref = main
files = browse/SKILL.md, browse/sections/command-list.md, ship/SKILL.md, ship/sections/changelog.md, ship/sections/pr-body.md, investigate/SKILL.md, qa/SKILL.md, qa-only/SKILL.md, design-review/SKILL.md

[impeccable]
kind = npx
install = npx --yes impeccable install --yes --global
update = npx --yes impeccable update --yes --global
keep = true

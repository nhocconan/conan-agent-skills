# Portable production profile. Invoke with: codex --profile production
# Astra is the lead under the shared routing policy. Worker model overrides are
# selected per task; authentication, provider URLs, and machine trust remain local.

model = "gpt-6-astra"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["CLAUDE.md"]

[sandbox_workspace_write]
network_access = false
writable_roots = []

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

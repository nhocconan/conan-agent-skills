# Portable production profile. Invoke with: codex --profile production
# This is a Codex harness, so its lead comes from the Codex row of the canonical
# routing policy (agent-orchestration/sections/routing.md), which is the source of
# truth; a config file must hold a literal string, so the ID is duplicated here.
# Re-check it against routing.md on any model release or deprecation.
model = "gpt-6-astra"  # model-id-allow
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"
project_doc_max_bytes = 32768
project_doc_fallback_filenames = ["CLAUDE.md"]

[sandbox_workspace_write]
network_access = false
writable_roots = []

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

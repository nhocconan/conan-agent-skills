name: Project rule parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 coding-env-bootstrap/project_rules.py check --root .
      - run: python3 -m unittest discover -s coding-env-bootstrap/tests -p 'test_project_rules.py' -v
      - run: python3 skill-miner/validate_skills.py
      - run: python3 skill-miner/context_budget.py --no-ratchet
      - run: python3 -m unittest discover -s skill-miner/tests -v
